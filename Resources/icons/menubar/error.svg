    error — 원 윤곽 + 느낌표 — 전환 실패 / 헬퍼 미설치

    크게 깔린 Wi-Fi 아치(베이스) 위에 작은 배지를 얹었다.
    배지는 캔버스의 69% — 주인공은 Wi-Fi 다.
    배지 둘레는 2.6 단위 파내(knockout) 투명 링을 두었다 —
    템플릿 이미지는 단색이라 갈라 놓지 않으면 한 덩어리로 뭉개진다.
    아치는 배지 뒤로 이어지다 그 링에 잘린다(잘린 넓이 242단위²).

    바운딩박스 x 0.29..49.20 / y 0.80..35.20  (50x36 격자 = @2x 픽셀)
    잉크 비율 29.1%  — 세 상태를 맞춰 두었다
    정점의 점과 배지 사이 여유 0.49단위 (음수가 되면 점이 잘린다)

    템플릿 이미지 규약: 단색 검정 + 알파만. 색·그라디언트·그림자를
    넣지 마라. macOS 가 메뉴바 배경에 맞춰 자동으로 반전시킨다.
    형태는 make-icons.py 가 만든다 — 이 파일을 손으로 고치지 마라.
