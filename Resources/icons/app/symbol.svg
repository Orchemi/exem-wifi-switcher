  <!--
    앱 심볼 — 메뉴바 3종이 공유하는 Wi-Fi 베이스 그대로다.
    앱은 상태가 없으므로 배지를 얹지 않는다: Dock 에는 도구의 정체만,
    메뉴바에는 거기에 상태 배지를 더해 보여준다.
    메뉴바 쪽은 오른쪽 아치를 길게 빼 배지 뒤로 넣지만(잘려 없어진다),
    여기서는 좌우 대칭으로 그린다 — 가릴 것이 없다.
    바운딩박스 577x416, 타일 변의 70%(가로 기준).
    검정으로 그려 두고 export.sh 가 흰색으로 뒤집어 쓴다.
  -->
